interface:
  display_name: "Writting Skill"
  short_description: "博客、漫画文章与书稿写作，兼顾事实、角色一致性、查重和版权门禁"
  default_prompt: "使用 $writting-skill 完成这项写作任务。先选择博客或写书模式，再明确读者、目的、事实来源与关键论证。博客模式维护单篇结构、产品事实与发布检查；漫画文章同时交付正文与分镜，使用 better-imagegen 生成场景，并读取已配置角色表保持人物一致；写书模式维护 book contract、章节连续性、来源台账与严格版权门禁。书稿先运行本地相似度检查，交互任务默认使用 Codex 联网搜索特征句，独立 CLI 或 CI 才选配 Brave；中国大陆出版默认使用万方官方报告适配器，出版社指定其他平台时以其要求为准。开源项目引用只做比例适当的来源核验，复制、改写或分发其材料时才升级到 commit、路径级 License 和义务门禁。"
