name: Validate skills
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests
      - run: python3 -m unittest discover -s skills/productivity/memory-distill/scripts -p 'test_*.py'
      - run: node --test skills/productivity/personal-records-reader/tests/read.test.mjs
      - run: python3 skills/design/lake-report-design/scripts/validate-lake-tokens.py
      - run: python3 -m unittest discover -s skills/writing/writting-skill/tests
      - run: python3 -m pip install -r skills/design/better-imagegen/requirements.txt
      - run: python3 -m unittest discover -s skills/design/better-imagegen/scripts -p 'test_*.py'
      - run: python3 -m unittest discover -s skills/design/better-imagegen/tests
      - run: python3 skills/design/qingshan-design/scripts/validate_tokens.py
      - run: python3 skills/engineering/windows-app-automation/tests/validate_structure.py
      - run: node --test skills/design/better-imagegen/scripts/test_validate_diagram_layout.mjs
